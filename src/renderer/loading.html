<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>DSH Desktop - 加载中</title>
    <style>
      /* 主题变量：默认浅色；<html data-theme="dark"> 时覆盖为深色（即出厂配色）。
         data-theme 由 preload 在 document_start 同步打标（首屏无闪烁），
         运行中切换由页面脚本订阅 theme-changed 更新 */
      :root {
        --bg: #ffffff;
        --text: #333333;
        --status: #555555;
        --hint: #8a8a94;
        --version: #a0a0aa;
        --spinner-track: rgba(0, 0, 0, 0.08);
        --accent: #3498db;
      }

      :root[data-theme='dark'] {
        --bg: #1a1a2e;
        --text: #e0e0e0;
        --status: #b0b0b0;
        --hint: #707080;
        --version: #505060;
        --spinner-track: rgba(255, 255, 255, 0.1);
        --accent: #3498db;
      }

      /* 全局重置 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      /* 旋转加载圈：使用 CSS border + animation 实现 */
      .spinner {
        width: 64px;
        height: 64px;
        border: 6px solid var(--spinner-track);
        border-top-color: var(--accent);
        border-radius: 50%;
        margin: 0 auto 24px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .status {
        font-size: 1rem;
        color: var(--status);
        min-height: 1.5em;
        line-height: 1.5;
        word-break: break-word;
      }

      .hint {
        font-size: 0.85rem;
        color: var(--hint);
        margin-top: 24px;
      }

      .version {
        font-size: 0.8rem;
        color: var(--version);
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner" id="spinner"></div>
      <div class="status" id="status">正在启动 DSH 服务...</div>
      <div class="hint">首次启动可能需要 1-3 分钟下载组件</div>
      <div class="version" id="version">当前版本: 获取中...</div>
      <div class="version" id="app-version">应用版本: 获取中...</div>
    </div>
    <script>
      // 订阅主题变化：更新 <html> 的 data-theme 切换 CSS 变量色板
      // （首屏打标由 preload 在 document_start 同步完成，此处仅处理运行中切换）
      ;(function () {
        if (window.dsh && typeof window.dsh.onThemeChanged === 'function') {
          window.dsh.onThemeChanged(function (info) {
            document.documentElement.dataset.theme = info.effective
          })
        }
      })()

      // 订阅主进程发送的状态更新（由 preload 暴露的 window.dsh.onStatus）
      ;(function () {
        if (window.dsh && typeof window.dsh.onStatus === 'function') {
          window.dsh.onStatus(function (status) {
            var el = document.getElementById('status')
            if (el) el.textContent = status
          })
        }
      })()

      // 获取已安装的 DSH 版本号
      ;(function () {
        if (window.dsh && typeof window.dsh.getInstalledVersion === 'function') {
          window.dsh.getInstalledVersion().then(function (version) {
            var el = document.getElementById('version')
            if (el) el.textContent = '当前版本: v' + version
          }).catch(function () {
            var el = document.getElementById('version')
            if (el) el.textContent = '当前版本: 未知'
          })
        }
      })()

      // 获取桌面应用自身的版本号
      ;(function () {
        if (window.dsh && typeof window.dsh.getAppVersion === 'function') {
          window.dsh.getAppVersion().then(function (version) {
            var el = document.getElementById('app-version')
            if (el) el.textContent = '应用版本: v' + version
          }).catch(function () {
            var el = document.getElementById('app-version')
            if (el) el.textContent = '应用版本: 未知'
          })
        }
      })()
    </script>
  </body>
</html>

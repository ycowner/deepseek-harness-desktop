<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>DSH Desktop - 加载中</title>
    <style>
      /* 全局重置 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: #1a1a2e;
        color: #e0e0e0;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 2rem;
      }

      /* 旋转加载圈：使用 CSS border + animation 实现 */
      .spinner {
        width: 64px;
        height: 64px;
        border: 6px solid rgba(255, 255, 255, 0.1);
        border-top-color: #3498db;
        border-radius: 50%;
        margin: 0 auto 24px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .status {
        font-size: 1rem;
        color: #b0b0b0;
        min-height: 1.5em;
        line-height: 1.5;
        word-break: break-word;
      }

      .hint {
        font-size: 0.85rem;
        color: #707080;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner" id="spinner"></div>
      <div class="status" id="status">正在启动 DSH 服务...</div>
      <div class="hint">首次启动可能需要 1-3 分钟下载组件</div>
    </div>
    <script>
      // 订阅主进程发送的状态更新（由 preload 暴露的 window.dsh.onStatus）
      ;(function () {
        if (window.dsh && typeof window.dsh.onStatus === 'function') {
          window.dsh.onStatus(function (status) {
            var el = document.getElementById('status')
            if (el) el.textContent = status
          })
        }
      })()
    </script>
  </body>
</html>

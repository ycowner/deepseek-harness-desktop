<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>DSH Desktop</title>
    <style>
      /* 主题变量：默认浅色；<html data-theme="dark"> 时覆盖为深色。
         data-theme 由 preload 在 document_start 同步打标（首屏无闪烁），
         运行中切换由页面脚本订阅 theme-changed 更新 */
      :root {
        --tb-bg: #f3f3f3;
        --tb-text: #1f1f1f;
        --tb-btn-hover: rgba(0, 0, 0, 0.06);
        --tb-btn-active: rgba(0, 0, 0, 0.1);
        --tb-focus-ring: rgba(0, 0, 0, 0.45);
      }

      :root[data-theme='dark'] {
        /* 深色变量集即出厂配色（与主进程 titleBarOverlay #202020 同步） */
        --tb-bg: #202020;
        --tb-text: #e6e6e6;
        --tb-btn-hover: rgba(255, 255, 255, 0.1);
        --tb-btn-active: rgba(255, 255, 255, 0.16);
        --tb-focus-ring: rgba(255, 255, 255, 0.6);
      }

      /* 全局重置 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        /* 标题栏内容均在 48px 内，不向下溢出（余额明细 tooltip 已改为注入
           DSH 内容页展示，见下方徽章脚本注释，不再需要从此页下探） */
        overflow: hidden;
      }

      body {
        /* 高度与主进程 titleBarOverlay.height（48px）保持一致 */
        height: 48px;
        /* 背景随主题切换：必须与主进程 titleBarOverlay.color 同步，
           漏一处会出现色差断层（主进程切主题时会同步调 setTitleBarOverlay） */
        background: var(--tb-bg);
        color: var(--tb-text);
        font-family: system-ui, -apple-system, sans-serif;
        /* 整条标题栏可拖拽移动窗口（双击最大化由系统 WCO 层处理） */
        -webkit-app-region: drag;
        user-select: none;
      }

      /* 左侧应用图标（16x16，data URL 由主进程通过 IPC 提供） */
      .app-icon {
        position: absolute;
        left: 12px;
        top: 16px;
        width: 16px;
        height: 16px;
        display: none; /* data URL 加载成功后再显示 */
      }

      .title {
        position: absolute;
        left: 38px;
        /* 垂直居中于 48px 标题栏。注意不能用 top:50%——绝对定位的包含块是整页
           （主 webContents 占满窗口高），会把文字打到窗口中部、被内容视图遮挡 */
        top: 0;
        height: 48px;
        line-height: 48px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
      }

      /* 帮助/设置按钮共用基础样式（文字形式，配色随主题） */
      .help-btn,
      .settings-btn {
        position: absolute;
        /* 垂直居中于 48px 标题栏（28px 按钮，上下各 10px） */
        top: 10px;
        height: 28px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--tb-text);
        font-size: 12px;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        /* 按钮必须脱离拖拽区域，否则点击事件不会触发 */
        -webkit-app-region: no-drag;
      }

      /* 设置按钮：位于标题文字「DSH Desktop」之后（left: 38px 起的 12px 标题约 70-80px 宽），
         紧邻帮助按钮左侧 */
      .settings-btn {
        width: 48px;
        left: 130px;
      }

      /* 帮助按钮：位于设置按钮右侧（130 + 48 宽 + 8 间距） */
      .help-btn {
        width: 48px;
        left: 186px;
      }

      /* 交互态用 JS 管理的类名替代 :hover / :active 伪类：原生菜单（Menu.popup）
         弹出期间渲染进程收不到鼠标事件，菜单关闭后若鼠标已移出按钮，伪类状态会滞留，
         且标题栏仅 48px 高、下方是独立 webContents 的 dshView，移出后永远不会自动清除。
         类名能在窗口失焦 / 菜单关闭（help/settings-menu-closed 通知）时主动复位，见下方脚本 */
      .help-btn.is-hover,
      .settings-btn.is-hover {
        background: var(--tb-btn-hover);
      }
      
      .help-btn.is-active,
      .settings-btn.is-active {
        background: var(--tb-btn-active);
      }
      
      /* focus 状态：鼠标点击后的 :focus 不显示焦点框，仅键盘（Tab）聚焦显示 */
      .help-btn:focus:not(:focus-visible),
      .settings-btn:focus:not(:focus-visible) {
        outline: none;
      }
      
      .help-btn:focus-visible,
      .settings-btn:focus-visible {
        outline: 1px solid var(--tb-focus-ring);
        outline-offset: -1px;
      }

      /* ==================== DeepSeek 余额徽章 ==================== */
      /* 样式对齐设计稿 balance-badge-preview.html（验收基准）：状态图标 + 分态色板 +
         low 整徽章脉冲。数据由主进程 deepseek-balance.ts 查询后经 IPC 推送（只含数字，绝不含 API Key）。
         交互态沿用 is-hover / is-active 类名，不使用 :hover / :active 伪类
         （原因见上方按钮注释：原生菜单期间收不到鼠标事件，伪类会滞留）。
         主题机制与全页一致：默认浅色值，:root[data-theme='dark'] 覆盖深色值 */

      /* 徽章容器：紧贴帮助按钮右侧（帮助按钮 left:186 + 宽48 + 8 间距）。
         余额明细 tooltip 不在本页渲染（dshView 子视图绘制在主 webContents 之上会遮挡），
         由主进程注入 DSH 内容页展示，故本容器只负责徽章自身布局 */
      .bb-wrap {
        position: absolute;
        left: 242px;
        top: 10px;
        height: 28px;
      }

      /* 徽章基础：半透明底 + 中性灰字 + 1px 透明边框占位（警示态显边框时尺寸不跳动） */
      .balance-badge {
        height: 28px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.05);
        color: #666b74;
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        font-family: inherit;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s, border-color 0.15s;
        /* 必须脱离拖拽区域，否则点击事件不会触发 */
        -webkit-app-region: no-drag;
      }

      :root[data-theme='dark'] .balance-badge {
        background: rgba(255, 255, 255, 0.06);
        color: #9aa0a8;
      }

      .balance-badge.is-hover {
        background: rgba(0, 0, 0, 0.09);
      }

      :root[data-theme='dark'] .balance-badge.is-hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .balance-badge.is-active {
        background: var(--tb-btn-active);
      }

      .balance-badge:focus:not(:focus-visible) {
        outline: none;
      }

      .balance-badge:focus-visible {
        outline: 1px solid var(--tb-focus-ring);
        outline-offset: -1px;
      }

      /* 状态图标：13x13，随状态切换钱包/警告/钥匙/刷新/横杠（内容见脚本 ICONS） */
      .bb-ico {
        width: 13px;
        height: 13px;
        flex: none;
        display: flex;
      }

      .bb-ico svg {
        width: 13px;
        height: 13px;
      }

      .bb-text {
        font-variant-numeric: tabular-nums;
      }

      /* ¥ 符号位与金额紧贴：负 margin 抵消 flex gap（窄窗口符号隐藏后不影响布局） */
      .balance-badge .bb-symbol {
        margin-right: -6px;
      }

      /* loading 旋转圈 */
      .bb-spin {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        flex: none;
        border: 1.5px solid currentColor;
        border-top-color: transparent;
        animation: bb-spin 0.7s linear infinite;
      }

      /* low 态闪烁圆点：仅余额不足时由脚本渲染（6px） */
      .bb-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
        animation: bb-blink 1s steps(2, start) infinite;
      }

      /* 状态：正常 —— 绿色语义色（克制，不抢眼） */
      .balance-badge[data-status='ok'] {
        color: #1a7f37;
        background: rgba(26, 127, 55, 0.1);
      }

      :root[data-theme='dark'] .balance-badge[data-status='ok'] {
        color: #7ee787;
        background: rgba(63, 185, 80, 0.13);
      }

      .balance-badge[data-status='ok'].is-hover {
        background: rgba(26, 127, 55, 0.18);
      }

      :root[data-theme='dark'] .balance-badge[data-status='ok'].is-hover {
        background: rgba(63, 185, 80, 0.22);
      }

      /* 状态：余额不足 —— 红色强警示 + 整徽章脉冲呼吸（压迫感最强） */
      .balance-badge[data-status='low'] {
        color: #cf222e;
        background: rgba(207, 34, 46, 0.1);
        border-color: rgba(207, 34, 46, 0.4);
        animation: bb-danger-pulse 1.6s ease-in-out infinite;
      }

      :root[data-theme='dark'] .balance-badge[data-status='low'] {
        color: #ff7b72;
        background: rgba(248, 81, 73, 0.16);
        border-color: rgba(248, 81, 73, 0.45);
      }

      /* 状态：Key 失效（401）—— 橙色警示 */
      .balance-badge[data-status='auth'] {
        color: #9a6700;
        background: rgba(210, 153, 34, 0.13);
        border-color: rgba(173, 127, 0, 0.4);
      }

      :root[data-theme='dark'] .balance-badge[data-status='auth'] {
        color: #f5b444;
        background: rgba(245, 158, 11, 0.14);
        border-color: rgba(245, 158, 11, 0.38);
      }

      /* 状态：网络异常 / 未配置 / 中转站 —— 中性灰，静默降级 */
      .balance-badge[data-status='net'],
      .balance-badge[data-status='nocfg'],
      .balance-badge[data-status='relay'] {
        color: #666b74;
      }

      :root[data-theme='dark'] .balance-badge[data-status='net'],
      :root[data-theme='dark'] .balance-badge[data-status='nocfg'],
      :root[data-theme='dark'] .balance-badge[data-status='relay'] {
        color: #9aa0a8;
      }

      @keyframes bb-danger-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.45);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(248, 81, 73, 0);
        }
      }

      @keyframes bb-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bb-blink {
        50% {
          opacity: 0.25;
        }
      }

      /* 窄窗口：省掉 ¥ 符号位，保住金额与 WCO 三键的间距 */
      @media (max-width: 540px) {
        .balance-badge .bb-symbol {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <img class="app-icon" id="app-icon" alt="" draggable="false" />
    <div class="title">DSH Desktop</div>
    <button class="settings-btn" id="settings-btn" title="设置" aria-label="设置">设置</button>
    <button class="help-btn" id="help-btn" title="帮助" aria-label="帮助">帮助</button>
    <!-- DeepSeek 余额徽章：位于帮助按钮右侧，悬停出明细 tooltip，点击手动刷新。
         骨架仅为首帧 loading 占位，内容由脚本按状态重建（图标 + 文案） -->
    <div class="bb-wrap" id="bb-wrap">
      <button class="balance-badge" id="balance-badge" type="button" data-status="loading" aria-label="DeepSeek 余额，点击刷新">
        <span class="bb-spin" aria-hidden="true"></span>
        <span class="bb-text">查询中</span>
      </button>
    </div>
    <script>
      // 订阅主题变化：更新 <html> 的 data-theme 切换 CSS 变量色板
      // （首屏打标由 preload 在 document_start 同步完成，此处仅处理运行中切换）
      ;(function () {
        if (window.dsh && typeof window.dsh.onThemeChanged === 'function') {
          window.dsh.onThemeChanged(function (info) {
            document.documentElement.dataset.theme = info.effective
          })
        }
      })()
      // 加载应用图标：主进程读取 icon.ico（dev: build/ / 打包: resources/）转 32x32 PNG
      // data URL 后经 IPC 返回。走 data URL 规避两种环境的路径问题：
      // dev 页面在 localhost:5173 引用不到 build/ 目录；打包后页面在 asar 内、图标在 asar 外。
      ;(function () {
        var img = document.getElementById('app-icon')
        if (!img) return
        if (window.dsh && typeof window.dsh.getAppIcon === 'function') {
          window.dsh.getAppIcon().then(function (url) {
            if (url) {
              img.src = url
              img.style.display = 'block'
            }
          }).catch(function () { /* 图标加载失败时仅保持隐藏，不影响标题栏其他功能 */ })
        }
      })()

      // 帮助按钮交互状态管理：is-hover / is-active 类名替代 :hover / :active 伪类。
      // 原生帮助菜单弹出期间渲染进程收不到鼠标事件，菜单关闭后若鼠标已移出按钮，
      // 伪类状态会滞留且标题栏页面永远不会自动清除（下方内容区是独立 webContents）。
      // 三个复位时机：窗口失焦/重新聚焦（菜单、对话框、Alt+Tab 都会经过）、
      // 主进程菜单关闭通知（help-menu-closed，覆盖 Esc / 点击外部 / 选中项全部路径）。
      // 复位后若鼠标仍在按钮上，下一次真实鼠标移动会经 mouseenter 恢复高亮。
      ;(function () {
        var btn = document.getElementById('help-btn')
        if (!btn) return

        function resetStates() {
          btn.classList.remove('is-hover')
          btn.classList.remove('is-active')
        }

        btn.addEventListener('mouseenter', function () {
          btn.classList.add('is-hover')
        })
        btn.addEventListener('mouseleave', resetStates)
        btn.addEventListener('mousedown', function () {
          btn.classList.add('is-active')
        })
        btn.addEventListener('mouseup', function () {
          btn.classList.remove('is-active')
        })

        // 窗口失焦后鼠标状态不再可信（菜单/对话框抢走输入），重新聚焦时同样先复位，
        // 交由后续真实鼠标事件重建状态，避免残留
        window.addEventListener('blur', resetStates)
        window.addEventListener('focus', resetStates)

        if (window.dsh && typeof window.dsh.onHelpMenuClosed === 'function') {
          window.dsh.onHelpMenuClosed(resetStates)
        }
      })()

      // 点击「帮助」按钮：把按钮位置（页面内 CSS 像素 = 窗口客户区相对坐标）发给主进程，
      // 主进程直接以该坐标在按钮正下方弹出原生菜单（实测 popup x/y 按窗口相对坐标解释，
      // 不叠加窗口屏幕位置偏移，详见 AGENTS.md §12.2 第 23 条）
      ;(function () {
        var btn = document.getElementById('help-btn')
        if (!btn) return
        btn.addEventListener('click', function () {
          if (window.dsh && typeof window.dsh.showHelpMenu === 'function') {
            var rect = btn.getBoundingClientRect()
            window.dsh.showHelpMenu({ x: rect.left, y: rect.bottom, width: rect.width })
          }
        })
      })()

      // 「设置」按钮：交互态管理与复位机制复刻帮助按钮（is-hover / is-active 类名 +
      // 失焦/聚焦复位 + 菜单关闭通知复位）。菜单为原生菜单（Menu.popup：
      // 主题 → 跟随系统 / 浅色 / 深色），原生菜单弹出期间渲染进程收不到鼠标事件，
      // 关闭后若鼠标已移出按钮，伪类状态会滞留且标题栏页面永远不会自动清除
      // （下方内容区是独立 webContents）。复位时机：窗口失焦/重新聚焦、
      // 主进程菜单关闭通知（settings-menu-closed）；
      // 复位后若鼠标仍在按钮上，下一次真实鼠标移动会经 mouseenter 恢复高亮
      ;(function () {
        var btn = document.getElementById('settings-btn')
        if (!btn) return

        function resetStates() {
          btn.classList.remove('is-hover')
          btn.classList.remove('is-active')
        }

        btn.addEventListener('mouseenter', function () {
          btn.classList.add('is-hover')
        })
        btn.addEventListener('mouseleave', resetStates)
        btn.addEventListener('mousedown', function () {
          btn.classList.add('is-active')
        })
        btn.addEventListener('mouseup', function () {
          btn.classList.remove('is-active')
        })

        // 窗口失焦后鼠标状态不再可信（菜单/对话框抢走输入），重新聚焦时同样先复位，
        // 交由后续真实鼠标事件重建状态，避免残留
        window.addEventListener('blur', resetStates)
        window.addEventListener('focus', resetStates)

        if (window.dsh && typeof window.dsh.onSettingsMenuClosed === 'function') {
          window.dsh.onSettingsMenuClosed(resetStates)
        }

        // 点击「设置」：把按钮位置发给主进程，在按钮正下方弹出原生主题菜单（坐标规则与帮助菜单一致）
        btn.addEventListener('click', function () {
          if (window.dsh && typeof window.dsh.showSettingsMenu === 'function') {
            var rect = btn.getBoundingClientRect()
            window.dsh.showSettingsMenu({ x: rect.left, y: rect.bottom, width: rect.width })
          }
        })
      })()

      // ==================== DeepSeek 余额徽章 ====================
      // 查询在主进程 deepseek-balance.ts 完成（API Key 不出主进程），快照经 IPC
      // 推送，本段只做渲染与交互。状态与颜色的对应见上方 CSS data-status 选择器。
      // tooltip 面板由主进程注入 DSH 内容页展示（dshView 子视图绘制在主 webContents
      // 之上，本页内的面板会被 DSH 内容完全遮挡，早期"展开期间隐藏 dshView"方案
      // 会导致内容区黑屏已废弃）：本页只负责构建 tooltip 的内容 HTML，
      // 经 setBalanceTooltip(open, html) 发给主进程注入/关闭
      ;(function () {
        var wrap = document.getElementById('bb-wrap')
        var badge = document.getElementById('balance-badge')
        if (!wrap || !badge) return
        var lastSnap = null
        var tooltipOpen = false

        // 状态图标（与设计稿 balance-badge-preview.html 的 ICONS 一致）
        var ICONS = {
          wallet:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2"/><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 14h2.5"/></svg>',
          warn:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v5M12 18v.5"/></svg>',
          refresh:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-5.3L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14 5.3L20 16"/><path d="M20 20v-4h-4"/></svg>',
          key:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9"/><path d="M17 6l3 3"/></svg>',
          dash:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>'
        }

        function ico(name) {
          return '<span class="bb-ico" aria-hidden="true">' + ICONS[name] + '</span>'
        }

        // 徽章金额格式化：小于一万显示 39.63（¥ 由独立符号位 .bb-symbol 提供，
        // 渲染成「¥ 39.63」；窄窗口时符号位隐藏只剩数字），大于等于一万显示 1.23万。
        // 注意不要在这里加 ¥ 前缀——会与 .bb-symbol 叠加成双 ¥
        function fmtNum(v) {
          if (v == null || isNaN(v)) return '–––'
          if (v >= 10000) return (v / 10000).toFixed(2) + '万'
          return v.toFixed(2)
        }

        // tooltip 内金额格式化：面板独立展示，¥ 前缀直接拼在数字前
        function fmtCNY(v) {
          if (v == null || isNaN(v)) return '–––'
          if (v >= 10000) return '¥' + (v / 10000).toFixed(2) + '万'
          return '¥' + v.toFixed(2)
        }

        function fmtTime(ts) {
          if (!ts) return ''
          var d = new Date(ts)
          var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2)
          var md = ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2)
          var now = new Date()
          var isToday = d.toDateString() === now.toDateString()
          return (isToday ? '今天 ' : md + ' ') + hm
        }

        function row(label, value) {
          return '<div><div class="k">' + label + '</div><div class="v">' + value + '</div></div>'
        }

        // tooltip 内容按状态组装；动态值均为数字或固定文案，无远端文本，无 XSS 面
        function buildTooltip(s) {
          if (s.status === 'ok' || s.status === 'low') {
            var html = '<div class="bbt-title">DeepSeek 总余额（CNY）</div>'
            html += '<div class="bbt-amount' + (s.status === 'low' ? ' is-warn' : '') + '">' + fmtCNY(s.cny) + '</div>'
            html += '<div class="bbt-grid">'
            html += row('充值', fmtCNY(s.toppedUp)) + row('赠送', fmtCNY(s.granted))
            html += '</div>'
            if (s.usd != null) {
              html += '<div class="bbt-msg">USD 余额：$' + s.usd.toFixed(2) + '</div>'
            }
            if (s.status === 'low') {
              html += '<div class="bbt-msg">余额不足，DeepSeek 已暂停服务调用，请及时充值</div>'
            }
            html += '<div class="bbt-msg">更新于 ' + fmtTime(s.updatedAt) + ' · 每 5 分钟自动刷新</div>'
            html += '<div class="bbt-hint">点击徽章立即刷新</div>'
            return html
          }
          if (s.status === 'auth') {
            return '<div class="bbt-title">DeepSeek 余额</div><div class="bbt-amount is-warn">Key 已失效</div>'
              + '<div class="bbt-msg">请在 DSH「模型」页面更新 API Key 后重试</div>'
              + '<div class="bbt-hint">点击徽章重试</div>'
          }
          if (s.status === 'nocfg') {
            return '<div class="bbt-title">DeepSeek 余额</div><div class="bbt-amount">未配置</div>'
              + '<div class="bbt-msg">未检测到 DSH 配置的 DEEPSEEK_API_KEY</div>'
          }
          if (s.status === 'relay') {
            return '<div class="bbt-title">DeepSeek 余额</div><div class="bbt-amount">—</div>'
              + '<div class="bbt-msg">检测到自定义 API 地址（第三方中转），无法查询官方余额</div>'
          }
          if (s.status === 'net') {
            return '<div class="bbt-title">DeepSeek 余额</div><div class="bbt-amount">查询失败</div>'
              + '<div class="bbt-msg">' + (s.message || '网络异常，请稍后重试') + '</div>'
              + '<div class="bbt-hint">点击徽章重试</div>'
          }
          return '<div class="bbt-title">DeepSeek 余额</div><div class="bbt-amount">查询中…</div>'
        }

        function render(s) {
          if (!s) return
          lastSnap = s
          badge.dataset.status = s.status
          // 徽章内容按状态整体重建（对齐设计稿 renderMain）：图标 + 文案；
          // 动态值仅 fmtNum 输出的数字，无远端文本，无 XSS 面
          if (s.status === 'ok') {
            badge.innerHTML =
              ico('wallet') +
              '<span class="bb-symbol" aria-hidden="true">¥</span>' +
              '<span class="bb-amt">' + fmtNum(s.cny) + '</span>'
          } else if (s.status === 'low') {
            badge.innerHTML =
              ico('warn') +
              '<span class="bb-dot" aria-hidden="true"></span>' +
              '<span class="bb-text">余额不足 ¥' + fmtNum(s.cny) + '</span>'
          } else if (s.status === 'auth') {
            badge.innerHTML = ico('key') + '<span class="bb-text">Key 失效</span>'
          } else if (s.status === 'nocfg') {
            badge.innerHTML = ico('key') + '<span class="bb-text">未配置 Key</span>'
          } else if (s.status === 'net') {
            badge.innerHTML = ico('refresh') + '<span class="bb-text">获取失败</span>'
          } else if (s.status === 'relay') {
            badge.innerHTML = ico('dash') + '<span class="bb-text">余额 —</span>'
          } else {
            // loading（含未知状态兜底）：旋转圈 + 查询中
            badge.innerHTML =
              '<span class="bb-spin" aria-hidden="true"></span><span class="bb-text">查询中</span>'
          }
          // tooltip 展开中：面板由主进程注入 DSH 内容页，随快照推送最新内容
          if (tooltipOpen && window.dsh && typeof window.dsh.setBalanceTooltip === 'function') {
            window.dsh.setBalanceTooltip(true, buildTooltip(s))
          }
        }

        function resetStates() {
          badge.classList.remove('is-hover')
          badge.classList.remove('is-active')
        }

        function openTooltip() {
          if (tooltipOpen) return
          tooltipOpen = true
          // 面板注入在 DSH 内容页（主进程 balance-tooltip IPC），内容取当前快照；
          // 附带徽章实时 rect，主进程据此把面板水平居中到徽章（徽章宽度随状态变化）
          if (lastSnap && window.dsh && typeof window.dsh.setBalanceTooltip === 'function') {
            var r = badge.getBoundingClientRect()
            window.dsh.setBalanceTooltip(true, buildTooltip(lastSnap), { left: r.left, width: r.width })
          }
        }

        function closeTooltip() {
          if (!tooltipOpen) return
          tooltipOpen = false
          if (window.dsh && typeof window.dsh.setBalanceTooltip === 'function') {
            window.dsh.setBalanceTooltip(false)
          }
        }

        // 徽章交互态：is-hover / is-active 类名（禁 :hover 伪类，原因同帮助/设置按钮）
        badge.addEventListener('mouseenter', function () {
          badge.classList.add('is-hover')
        })
        badge.addEventListener('mouseleave', resetStates)
        badge.addEventListener('mousedown', function () {
          badge.classList.add('is-active')
        })
        badge.addEventListener('mouseup', function () {
          badge.classList.remove('is-active')
        })

        // tooltip 开合：面板注入在 DSH 内容页（独立 webContents），鼠标无法从徽章
        // 移入面板，故离开徽章即关（与原生 tooltip 行为一致）
        wrap.addEventListener('mouseenter', openTooltip)
        wrap.addEventListener('mouseleave', closeTooltip)

        // 失焦/聚焦时鼠标状态与 tooltip 均不可信，一并复位
        window.addEventListener('blur', function () {
          resetStates()
          closeTooltip()
        })
        window.addEventListener('focus', resetStates)

        // 点击徽章：立即给 loading 骨架反馈，再通知主进程查询
        badge.addEventListener('click', function () {
          render({ status: 'loading', updatedAt: 0 })
          if (window.dsh && typeof window.dsh.refreshBalance === 'function') {
            window.dsh.refreshBalance()
          }
        })

        // 订阅推送 + 初始化读取当前快照（不触发查询）
        if (window.dsh && typeof window.dsh.onBalanceUpdate === 'function') {
          window.dsh.onBalanceUpdate(render)
        }
        if (window.dsh && typeof window.dsh.getBalance === 'function') {
          window.dsh.getBalance().then(render).catch(function () { /* 保持默认骨架 */ })
        }
      })()
    </script>
  </body>
</html>
